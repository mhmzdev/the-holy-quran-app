name: al_quran
description: Flutter App for the holy book of Qur'an.
publish_to: none

version: 2.6.0+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  # packages
  al_quran_repo:
    path: packages/al_quran_repo
  al_quran_api:
    path: packages/al_quran_api
  
  # utils
  intl: 0.20.3
  share_plus: 13.3.0
  recase: 4.1.0
  shimmer: 4.0.0
  cupertino_icons: 1.0.8
  supercharged: 2.1.1

  # network
  dio: 5.11.1
  url_launcher: 6.3.2
  
  # state management
  provider: 6.1.5+1
  equatable: 2.1.0
  flutter_bloc: 9.1.1
  get_it: 9.2.1

  # models generation
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # icon pack
  iconsax: 0.0.8

  # cache
  hive_ce: 2.19.3
  hive_ce_flutter: 2.3.4
  shared_preferences: 2.5.5

  # app info
  package_info_plus: 10.2.1
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # lints
  flutter_lints: 6.0.0

  # Code generation (Freezed / json_serializable / Hive CE adapters) lives in
  # packages/al_quran_api — run build_runner there, not here.

  # tests
  mocktail: 1.0.5
  bloc_test: 10.0.0

  # launcher icons
  flutter_launcher_icons: 0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/app_icon.png"


# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/logos/
    - assets/intro/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 600
        - asset: fonts/Poppins-Light.ttf
          weight: 200
        - asset: fonts/Poppins-Bold.ttf
          weight: 900
        - asset: fonts/Poppins-Italic.ttf
        - asset: fonts/Poppins-SemiBold.ttf
    - family: Noor
      fonts:
        - asset: fonts/noor-regular.ttf
