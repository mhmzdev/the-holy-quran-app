include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Freezed models carry @HiveType on the factory constructor (Hive CE's
    # Freezed pattern); the analyzer flags the target but codegen is correct.
    invalid_annotation_target: ignore

linter:
  rules:
    - require_trailing_commas
    - prefer_single_quotes
    - prefer_const_declarations
    - unnecessary_this
    - prefer_final_locals
    - omit_local_variable_types
