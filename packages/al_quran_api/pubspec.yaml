name: al_quran_api
description: Data layer for The Holy Qur'an app — alquran.cloud HTTP client, Freezed/Hive models and the data provider.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # network
  dio: 5.11.1

  # models generation
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # cache local storage
  hive_ce: 2.19.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0

  # code generation
  build_runner: 2.16.1
  hive_ce_generator: 1.11.3
  freezed: 4.0.1
  json_serializable: 6.14.1
